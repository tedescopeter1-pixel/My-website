<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07120a">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RepteSave">
<title>RepteSave</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf0ea;--card:#fbfdfb;--ink:#12261f;--mute:#5a6e63;--line:#cfdbd2;--moss:#1f5a4a;--gold:#f2b705;--amber:#9a6b00;--red:#b8472a;--blue:#2f6aa3;--tab:#123b30;--tabink:#eaf0ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a15;--card:#17261f;--ink:#e6efe8;--mute:#9bb0a3;--line:#2a3d33;--moss:#63b58b;--amber:#e3b23c;--red:#e5826f;--blue:#7fb2e6;--tab:#17261f;--tabink:#e6efe8}}
:root[data-theme="dark"]{--bg:#0f1a15;--card:#17261f;--ink:#e6efe8;--mute:#9bb0a3;--line:#2a3d33;--moss:#63b58b;--amber:#e3b23c;--red:#e5826f;--blue:#7fb2e6;--tab:#17261f;--tabink:#e6efe8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
main{max-width:640px;margin:0 auto;padding:16px}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.15;margin:0}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--mute);margin:6px 0 18px}
h2{font-size:20px;font-weight:800;margin:22px 0 8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
.chip[aria-pressed=true]{background:var(--moss);border-color:var(--moss);color:#fff}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--moss);width:0;transition:width .25s}
.small{font-size:14px;color:var(--mute)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.row{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row input[type=checkbox]{width:22px;height:22px;margin-top:2px;accent-color:var(--moss);flex:none}
.row.done span{text-decoration:line-through;color:var(--mute)}
.skip .row b{color:var(--red)}
.skip .row .x{color:var(--red);font-weight:800;flex:none;width:22px;text-align:center}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:2px 9px;border-radius:6px;margin-bottom:6px}
.t-must{background:color-mix(in srgb,var(--amber) 22%,transparent);color:var(--amber)}
.t-nice{background:color-mix(in srgb,var(--blue) 20%,transparent);color:var(--blue)}
.t-skip{background:color-mix(in srgb,var(--red) 20%,transparent);color:var(--red)}
.t-save{background:color-mix(in srgb,var(--moss) 22%,transparent);color:var(--moss)}
.grp{margin-top:16px}
form.add{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
form.add input:first-child,form.add button{grid-column:1/3}
input[type=text],input[type=number],input[type=email],input[type=date]{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.btn{border:0;background:var(--moss);color:#fff;font:inherit;font-weight:700;padding:12px;border-radius:10px;cursor:pointer}
.link{background:none;border:0;color:var(--red);font:inherit;cursor:pointer;padding:0 0 0 8px}
.sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.sum b{display:block;font:800 22px "Bricolage Grotesque",system-ui,sans-serif}
.sum .g b{color:var(--moss)}
.item{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;padding:0 14px}
summary{cursor:pointer;font-weight:700;padding:14px 0;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";float:right;color:var(--mute)}
details[open] summary::after{content:"–"}
details ul{margin:0 0 14px;padding-left:20px}
details li{margin-bottom:6px}
.note{background:color-mix(in srgb,var(--amber) 16%,transparent);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--tab);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;font-size:14px;background:none;border:0;color:var(--tabink);opacity:.6;font:inherit;font-weight:700;padding:10px 4px;border-radius:10px;cursor:pointer}
nav button[aria-selected=true]{opacity:1;background:rgba(255,255,255,.12)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{background:var(--tab);padding:14px 16px}
.top .in{max-width:640px;margin:0 auto;display:flex;gap:14px;align-items:center}
.top h1{color:var(--gold);font-size:28px}
.top p{margin:2px 0 0;color:#dbe8e0}
.lic{border-left:5px solid var(--gold);background:var(--card);padding:10px 12px;border-radius:10px;font-size:14px;margin:4px 0 14px}
.fact{background:var(--tab);color:#fff;border-left:6px solid var(--gold);border-radius:14px;padding:14px 16px;margin:4px 0 8px}
.fact p{margin:6px 0 0;font:700 19px/1.3 "Bricolage Grotesque",system-ui,sans-serif}
select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.mf{display:grid;gap:8px;padding-bottom:14px}
.ad{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.ad h3{font-size:18px;margin:6px 0 2px}
.ad p{margin:6px 0}
.price{font:800 20px "Bricolage Grotesque",system-ui,sans-serif;color:var(--moss)}
.ad .link{padding:0}

body{padding:0 0 24px calc(94px + env(safe-area-inset-left,0px))}
nav{top:0;right:auto;width:94px;flex-direction:column;justify-content:flex-start;gap:4px;padding:calc(10px + env(safe-area-inset-top,0px)) 6px 10px calc(6px + env(safe-area-inset-left,0px));overflow-y:auto}
nav button{flex:none;text-align:left;font-size:14px;padding:11px 8px}
.brand{display:block;text-align:center;margin-bottom:10px;color:var(--gold);font:800 13px "Bricolage Grotesque",system-ui,sans-serif}
.brand svg{display:block;margin:0 auto 4px}
select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.fg .w{grid-column:1/3}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.pc h3{font-size:18px;margin:0 0 2px}
.pc .pr{font-weight:800;color:var(--moss);margin:4px 0}
a.buy{display:block;text-align:center;text-decoration:none;background:var(--moss);color:#fff;font-weight:700;padding:11px;border-radius:10px;margin-top:8px}
.pl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px;margin:10px 0}
.pl div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.pl div:last-child{border-bottom:0;font-weight:800;font-size:18px}
.pos{color:var(--moss)}.neg{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:7px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
.sc{overflow-x:auto}

:root:not([data-theme="zz"]){--bg:#08140c;--card:#0f2216;--ink:#eef6ea;--mute:#a3b8a5;--line:#1f4a2b;--moss:#5a9a22;--gold:#ff9a1f;--amber:#ffb23d;--red:#ff6b4a;--blue:#a7d86e;--lime:#7bd32f;--tab:#07120a;--tabink:#eef6ea}
body{background:radial-gradient(900px 420px at 80% -10%,#14401f 0,transparent 65%),var(--bg)}
h1,h2,h3,.fact p{font-family:Anton,Impact,"Arial Narrow",sans-serif;font-weight:400;letter-spacing:.02em}
h2{text-transform:uppercase;font-size:24px}
.sub{text-transform:uppercase;letter-spacing:.12em;font-size:13px;color:var(--blue);font-weight:700}
.box,.pc,.ad,.pl,details,.lic{border:1.5px solid #2f6a24;border-radius:16px}
.tag{text-transform:uppercase;letter-spacing:.07em;border-radius:5px;padding:3px 10px;font-weight:800}
.t-save{background:color-mix(in srgb,var(--lime) 22%,transparent);color:var(--lime)}
.pos,.pc .pr,.ad .pr{color:var(--lime)}
.btn,a.buy{background:linear-gradient(#5a9a22,#3f7a14);text-transform:uppercase;letter-spacing:.06em;font-weight:800;border-radius:12px}
.chip{font-weight:700}
.chip[aria-pressed=true]{background:#5a9a22;border-color:#5db0ff;color:#fff}
.bar i{background:var(--lime)}
.row input[type=checkbox]{accent-color:#5a9a22}
.fact{background:linear-gradient(135deg,#1d5a24,#0e2a14);border-left:6px solid var(--gold);border-radius:16px}
nav{border-right:2px solid #2f6a24;background:#07120a}
nav button{text-transform:uppercase;letter-spacing:.05em;font-weight:800;font-size:12.5px;padding:11px 7px}
nav button[aria-selected=true]{background:linear-gradient(#5a9a22,#3f7a14);opacity:1;color:#fff}
.brand{color:#fff;font:400 17px/1 Anton,Impact,sans-serif;letter-spacing:.03em;margin-bottom:12px}
.brand i{font-style:normal;color:#5a9a22}
.af{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.af .w{grid-column:1/3}
.ad{background:var(--card);padding:12px 14px;margin-bottom:10px}
.ad h3{font-size:19px;margin:6px 0 2px}
.ad p{margin:6px 0}
.link.ok{color:var(--blue)}
#own{margin-bottom:10px}
.promo{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#0c2a14,#07130b);border:2px solid var(--lime);border-radius:16px;padding:12px;margin:0 0 14px;box-shadow:0 0 22px rgba(123,211,47,.25)}
.promo img{width:92px;height:auto;border-radius:10px;flex:none}
.promo h3{font-size:22px;margin:6px 0 4px;color:#fff}
.promo p{margin:0 0 8px}
.promo .btn{padding:10px 16px}
.splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;gap:12px;overflow-y:auto;text-align:center;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(22px + env(safe-area-inset-bottom,0px));background:radial-gradient(700px 520px at 50% 0,#14602d 0,#050d08 72%)}
.splash img{max-height:44vh;width:auto;max-width:72%;border-radius:20px;border:3px solid var(--lime);box-shadow:0 0 44px rgba(123,211,47,.5)}
.splash h1{font-size:40px;line-height:1.02;color:#fff;text-transform:uppercase;margin:4px 0 0}
.splash h1 i{font-style:normal;color:var(--lime)}
.splash .lead{font-size:17px;margin:0;color:#eaf6e6;max-width:420px}
.splash .sizes{display:flex;gap:12px}
.splash .sizes span{font:400 34px/1 Anton,Impact,sans-serif;color:var(--lime);border:3px solid var(--lime);border-radius:14px;padding:8px 20px;background:rgba(123,211,47,.1)}
.splash .go{width:100%;max-width:340px;font-size:18px;padding:15px;background:linear-gradient(#8fe03a,#5fae1c);color:#07130b}
.splash .sx{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:28px;line-height:1;cursor:pointer}
.newtag{background:var(--gold);color:#1a0d00;font:400 20px/1 Anton,Impact,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:8px 18px;border-radius:999px;margin-top:6px}
.pulse{animation:pls 1.6s ease-in-out infinite}
@keyframes pls{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.skx{display:flex;gap:12px;background:linear-gradient(135deg,#0c2a14,#07130b);border:2px solid var(--lime);border-radius:16px;padding:12px;margin:10px 0}
.skx img{width:104px;height:auto;border-radius:10px;align-self:flex-start;flex:none}
.skb{flex:1;min-width:0}
.skb h3{font-size:21px;margin:6px 0 4px;color:#fff}
.sz{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid #1f4f2a;margin-top:8px}
.sz .btn{padding:10px 16px}
.pimg{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;margin-bottom:8px}
#omsg{white-space:pre-line}
#smsg{font-weight:700;color:var(--lime)}
.splash>*{flex-shrink:0}
.gal{display:flex;gap:10px;overflow-x:auto;max-width:100%;flex:none;min-height:120px}
.splash .gal img{max-height:36vh;max-width:none;flex:none;border-radius:14px}
.btn.dsc{display:block;width:100%;margin-top:10px;background:transparent;border:2px solid var(--blue);color:var(--blue);padding:11px}
</style>
</head>
